---
# type: github-actions-workflow
# description: Builds and deploys the Landschaft web editor to GitHub Pages.
# last-updated: 2026-07-02
# last-model: codex-gpt-5
# last-change: read hosted MCP backend URL from repository variables
name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build -w @landschaft/shared && npm run build -w @landschaft/web
        env:
          GITHUB_PAGES: "true"
          VITE_LANDSCHAFT_MCP_HTTP_URL: ${{ vars.LANDSCHAFT_MCP_HTTP_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
